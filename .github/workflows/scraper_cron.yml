name: 24/7 Exam Notification & Scraper Cron

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run All Scrapers & Send Alerts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COACHING_NAME: "Sagar Coaching Centre, Bhagwanpur"
          COACHING_PHONE: "+91 91101 13671"
          COACHING_YOUTUBE: "https://www.youtube.com/@sagarcoachingcentrebhagwanpur"
          COACHING_TELEGRAM: "https://t.me/ShrvanKumarSagar"
        run: |
          python main.py
